<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nasi Goreng Kecombrang">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e4"/>
      <stop offset="1" stop-color="#e4d7bd"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d79a"/>
      <stop offset="1" stop-color="#c98f3e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg4)"/>
  <circle cx="60" cy="56" r="46" fill="#5f6020" opacity=".08"/>
  <circle cx="344" cy="248" r="54" fill="#195905" opacity=".05"/>

  <ellipse cx="200" cy="258" rx="112" ry="14" fill="#3d2b1f" opacity=".14"/>

  <!-- piring -->
  <ellipse cx="200" cy="212" rx="128" ry="42" fill="#ffffff" opacity=".85"/>
  <ellipse cx="200" cy="204" rx="104" ry="33" fill="#f9f8f3"/>
  <ellipse cx="200" cy="204" rx="104" ry="33" fill="none" stroke="#3d2b1f" stroke-opacity=".16" stroke-width="3"/>

  <!-- tumpukan nasi -->
  <path d="M120 200c4-52 36-86 80-86s76 34 80 86c-26 20-134 20-160 0Z" fill="url(#rice)"/>
  <path d="M150 152c12-16 26-22 38-24" stroke="#fdf6e4" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <path d="M214 140c14 2 24 8 32 18" stroke="#fdf6e4" stroke-width="6" stroke-linecap="round" opacity=".7"/>

  <!-- kemangi / kecombrang -->
  <path d="M262 150c22-8 36 2 34 16-3 16-22 22-34 12-10-8-10-22 0-28Z" fill="#5f6020"/>
  <path d="M148 138c-22-6-36 6-32 20 4 15 24 19 34 8 9-9 7-23-2-28Z" fill="#195905" opacity=".85"/>

  <!-- telur mata -->
  <circle cx="200" cy="164" r="26" fill="#fdfcf6"/>
  <circle cx="200" cy="164" r="12" fill="#f2b544"/>

  <!-- sambal -->
  <circle cx="160" cy="196" r="10" fill="#ba1a1a" opacity=".85"/>
  <circle cx="244" cy="192" r="8" fill="#ba1a1a" opacity=".7"/>
</svg>
